name: Release Build

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'  # Only stable releases (v1.0.0, v1.10.0, v12.3.4, etc.)
      # Pre-releases (v1.0.0-beta, v1.0.0-rc.1) must be triggered manually
      # Note: Uses glob pattern (not regex) - [0-9]* matches one or more digits
  workflow_dispatch:  # Allows manual triggering for pre-releases or testing

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract version from tag
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" == "tag" ]; then
            VERSION=${GITHUB_REF_NAME#v}
            echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Route the Play track from the version suffix:
          #   1.2.3        -> production
          #   1.2.3-alpha* -> alpha   (closed testing)
          #   1.2.3-beta*  -> beta
          #   1.2.3-<x>    -> internal (rc, etc.)
          case "$VERSION" in
            *-alpha*) TRACK=alpha ;;
            *-beta*)  TRACK=beta ;;
            *-*)      TRACK=internal ;;
            *)        TRACK=production ;;
          esac
          echo "track=$TRACK" >> $GITHUB_OUTPUT

          # Globally monotonic versionCode. Play requires it to strictly increase across
          # ALL tracks, so derive it from the run number rather than the semantic version
          # (two 1.2.3-alpha.N builds would otherwise share one code). Offset clears the
          # legacy computed codes (<= 19999 for 1.x.x).
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (track=$TRACK, code=$VERSION_CODE)"

      - name: Run quality checks
        run: ./gradlew ktlintCheck detekt :app:lintRelease

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed Release APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleRelease

      - name: Build signed Release AAB
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew bundleRelease

      - name: Rename APK with version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/nextcloud-tasks-${VERSION}.apk

      - name: Rename AAB with version
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cp app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/nextcloud-tasks-${VERSION}.aab

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "## Nextcloud Tasks Android v${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "### Downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo "- **APK**: For direct installation on Android devices" >> release_notes.md
          echo "- **AAB**: For uploading to Google Play Store" >> release_notes.md
          echo "" >> release_notes.md

          # If this is a tagged release, try to get the changelog
          if [ "${GITHUB_REF_TYPE}" == "tag" ]; then
            echo "### Changes" >> release_notes.md
            echo "" >> release_notes.md

            # Previous tag. For a stable release, diff against the last STABLE tag
            # (skip -alpha/-beta) so notes cover everything new since the last prod
            # release, not just the delta to the most recent pre-release.
            if echo "${GITHUB_REF_NAME}" | grep -q -- '-'; then
              PREV_TAG=$(git describe --tags --abbrev=0 ${GITHUB_REF_NAME}^ 2>/dev/null || echo "")
            else
              PREV_TAG=$(git describe --tags --abbrev=0 --exclude='*-*' ${GITHUB_REF_NAME}^ 2>/dev/null || echo "")
            fi

            if [ -n "$PREV_TAG" ]; then
              echo "Changes since ${PREV_TAG}:" >> release_notes.md
              echo "" >> release_notes.md
              git log ${PREV_TAG}..${GITHUB_REF_NAME} --pretty=format:"- %s (%an)" --no-merges >> release_notes.md
            else
              echo "- Initial release" >> release_notes.md
            fi
          else
            echo "### Development Build" >> release_notes.md
            echo "" >> release_notes.md
            echo "This is an automated development build." >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "### Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "1. Download the APK file" >> release_notes.md
          echo "2. Enable \"Install from Unknown Sources\" in Android settings" >> release_notes.md
          echo "3. Open the downloaded APK to install" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Requirements" >> release_notes.md
          echo "" >> release_notes.md
          echo "- Android 8.0 (API 26) or higher" >> release_notes.md
          echo "- Nextcloud server with Tasks app installed" >> release_notes.md

      - name: Generate Play Store release notes
        continue-on-error: true
        if: github.ref_type == 'tag' && env.HAS_PLAY_SECRET == 'true'
        env:
          HAS_PLAY_SECRET: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          NOTES_DIR="app/src/main/play/release-notes"
          # Stable release: diff against last STABLE tag so Play notes cover every
          # change since the last prod release (Play only shows the latest note per track).
          if echo "${GITHUB_REF_NAME}" | grep -q -- '-'; then
            PREV_TAG=$(git describe --tags --abbrev=0 ${GITHUB_REF_NAME}^ 2>/dev/null || echo "")
          else
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude='*-*' ${GITHUB_REF_NAME}^ 2>/dev/null || echo "")
          fi

          # Collect commits (capped at 3000 chars to keep the API payload manageable)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..${GITHUB_REF_NAME} --pretty=format:"- %s" --no-merges | head -c 3000)
          else
            COMMITS=""
          fi

          GROK_SUCCESS=false

          # Try Grok API if key available and commits exist
          if [ -n "$XAI_API_KEY" ] && [ -n "$COMMITS" ]; then
            PAYLOAD=$(jq -n \
              --arg commits "$COMMITS" \
              '{
                model: "grok-3-mini-fast",
                response_format: {type: "json_object"},
                messages: [
                  {
                    role: "system",
                    content: "Du bist ein Release-Notes-Schreiber für eine Android-App namens '\''Nextcloud Tasks'\''. Die App synchronisiert Aufgaben (Tasks/Todos) mit einem Nextcloud-Server."
                  },
                  {
                    role: "user",
                    content: ("Commits für diesen Release:\n" + $commits + "\n\nErstelle nutzerfreundliche Release Notes. Technische Details (CI, Refactoring, Code-Cleanup) weglassen. Nur nutzerrelevante Features und Bugfixes. Aufzählungsliste mit - (Bindestrich). Kein Markdown.\n\nAntworte ausschließlich mit einem validen JSON-Objekt (kein Markdown, kein Codeblock). Jeder Wert sind die Release Notes in der jeweiligen Sprache (max 450 Zeichen), mit genau diesen Schlüsseln: en, de, fr, es, it, nl, pt-BR, ru, pl, cs, zh-CN, ja.")
                  }
                ]
              }')

            RESPONSE=$(curl -sf --max-time 60 \
              -X POST "https://api.x.ai/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $XAI_API_KEY" \
              -d "$PAYLOAD" || echo "")

            if [ -n "$RESPONSE" ]; then
              CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || echo "")
              EN_NOTES=$(echo "$CONTENT" | jq -r '.en // empty' 2>/dev/null || echo "")

              # JSON key -> Play release-notes folder. Missing languages fall back to English.
              if [ -n "$EN_NOTES" ]; then
                for pair in en:en-US de:de-DE fr:fr-FR es:es-ES it:it-IT nl:nl-NL pt-BR:pt-BR ru:ru-RU pl:pl-PL cs:cs-CZ zh-CN:zh-CN ja:ja-JP; do
                  KEY="${pair%%:*}"
                  FOLDER="${pair##*:}"
                  VAL=$(echo "$CONTENT" | jq -r --arg k "$KEY" '.[$k] // empty' 2>/dev/null || echo "")
                  [ -z "$VAL" ] && VAL="$EN_NOTES"
                  mkdir -p "${NOTES_DIR}/${FOLDER}"
                  printf '%s' "${VAL:0:450}" > "${NOTES_DIR}/${FOLDER}/default.txt"
                done
                GROK_SUCCESS=true
                echo "✓ Release notes generated via Grok API (12 locales)"
              fi
            fi
          fi

          # Fallback: raw commit messages, written to every locale
          if [ "$GROK_SUCCESS" = false ]; then
            echo "→ Using fallback: raw commit messages"
            if [ -n "$PREV_TAG" ]; then
              NOTE=$(git log ${PREV_TAG}..${GITHUB_REF_NAME} --pretty=format:"- %s" --no-merges | head -c 500)
            else
              NOTE="Initial release."
            fi
            for FOLDER in en-US de-DE fr-FR es-ES it-IT nl-NL pt-BR ru-RU pl-PL cs-CZ zh-CN ja-JP; do
              mkdir -p "${NOTES_DIR}/${FOLDER}"
              printf '%s' "$NOTE" > "${NOTES_DIR}/${FOLDER}/default.txt"
            done
          fi

      - name: Publish to Google Play
        continue-on-error: true
        if: github.ref_type == 'tag' && env.HAS_PLAY_SECRET == 'true'
        env:
          HAS_PLAY_SECRET: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          # Track derived from the tag: production for v1.2.3, alpha/beta/internal for pre-releases.
          PLAY_TRACK: ${{ steps.version.outputs.track }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ runner.temp }}/play-service-account.json
        run: |
          printf '%s' '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > "$PLAY_SERVICE_ACCOUNT_JSON"
          echo "Publishing to Play track: $PLAY_TRACK"
          ./gradlew publishReleaseBundle
          rm -f "$PLAY_SERVICE_ACCOUNT_JSON"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/nextcloud-tasks-${{ steps.version.outputs.version }}.apk
            app/build/outputs/bundle/release/nextcloud-tasks-${{ steps.version.outputs.version }}.aab
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}  # Auto-detect pre-release from version
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact (for manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-tasks-${{ steps.version.outputs.version }}-apk
          path: app/build/outputs/apk/release/nextcloud-tasks-${{ steps.version.outputs.version }}.apk
          retention-days: 30

      - name: Upload AAB as artifact (for manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-tasks-${{ steps.version.outputs.version }}-aab
          path: app/build/outputs/bundle/release/nextcloud-tasks-${{ steps.version.outputs.version }}.aab
          retention-days: 30
